<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enable Microphone - AI Meeting Notetaker</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    button:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .success {
      display: none;
      color: #34d399;
      font-size: 16px;
      font-weight: 600;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Enable Microphone Access</h1>
    <p>AI Meeting Notetaker requires microphone permission to record your voice during Google Meet, Teams, and Zoom calls.</p>
    <button id="btn-grant">Click to Allow Microphone</button>
    <div class="success" id="success-msg">✅ Microphone enabled! This tab will close automatically...</div>
  </div>

  <script>
    document.getElementById('btn-grant').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('btn-grant').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        setTimeout(() => {
          window.close();
        }, 1500);
      } catch (err) {
        alert('Permission was not granted: ' + err.message + '\nPlease click the camera/mic icon in the address bar and select "Always allow".');
      }
    });

    // Auto-prompt on page load
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-grant').click();
    });
  </script>
</body>
</html>
